<!DOCTYPE html>
<html lang="bn">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | Masha Studio</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at top left,
          #302080 0%,
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          #073b55 0%,
          transparent 35%
        ),
        #050609;
    }


    .login-wrapper {
      width: 100%;
      max-width: 1050px;

      display: grid;
      grid-template-columns: 1fr 1fr;

      overflow: hidden;

      border:
        1px solid
        rgba(255,255,255,.1);

      border-radius: 28px;

      background:
        rgba(12,14,20,.96);

      box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);
    }


    /* =========================
       LEFT
       ========================= */

    .left {
      padding: 45px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      min-height: 650px;

      background:
        linear-gradient(
          145deg,
          rgba(109,93,252,.18),
          rgba(10,10,15,.2)
        );
    }


    .back {
      display: inline-flex;

      width: fit-content;

      padding:
        10px 15px;

      color: #d6d8df;

      text-decoration: none;

      border:
        1px solid
        rgba(255,255,255,.1);

      border-radius: 12px;

      background:
        rgba(255,255,255,.04);

      font-size: 13px;
      font-weight: 700;
    }


    .logo {
      width: 110px;
      height: 110px;

      object-fit: contain;

      margin-bottom: 25px;

      padding: 8px;

      border-radius: 22px;

      border:
        1px solid
        rgba(255,255,255,.1);

      background:
        rgba(255,255,255,.04);
    }


    .eyebrow {
      margin-bottom: 14px;

      color: #9c91ff;

      font-size: 11px;

      font-weight: 800;

      letter-spacing: 2px;

      text-transform: uppercase;
    }


    .left h1 {
      margin-bottom: 20px;

      font-size:
        clamp(
          42px,
          5vw,
          68px
        );

      line-height: .95;

      letter-spacing: -3px;
    }


    .left h1 span {
      color: #9c91ff;
    }


    .description {
      max-width: 430px;

      color: #969ba7;

      font-size: 15px;

      line-height: 1.8;
    }


    .pills {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }


    .pill {
      padding:
        9px 13px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 999px;

      background:
        rgba(255,255,255,.035);

      color: #a8adb7;

      font-size: 11px;

      font-weight: 700;
    }



    /* =========================
       RIGHT
       ========================= */

    .right {
      min-height: 650px;

      padding: 45px;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    .form-box {
      width: 100%;
      max-width: 390px;
    }


    .heading {
      margin-bottom: 25px;
    }


    .heading h2 {
      margin-bottom: 8px;

      font-size: 32px;

      letter-spacing: -1px;
    }


    .heading p {
      color: #959ba6;

      font-size: 13px;

      line-height: 1.7;
    }



    /* =========================
       ROLE BUTTONS
       ========================= */

    .roles {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      width: 100%;

      padding: 6px;

      margin-bottom: 25px;

      border:
        1px solid
        rgba(255,255,255,.09);

      border-radius: 16px;

      background: #080a0e;
    }


    .role-btn {
      width: 100%;

      min-height: 55px;

      border: none;

      border-radius: 11px;

      background: transparent;

      color: #777d88;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

      touch-action: manipulation;

      transition:
        background .2s ease,
        color .2s ease,
        transform .15s ease;
    }


    .role-btn:hover {
      color: #ffffff;
    }


    .role-btn:active {
      transform: scale(.97);
    }


    .role-btn.active {
      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #28223f,
          #1a1d27
        );

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.25);
    }



    /* =========================
       FIELDS
       ========================= */

    .field {
      margin-bottom: 17px;
    }


    .field label {
      display: block;

      margin-bottom: 8px;

      color: #c6cad1;

      font-size: 12px;

      font-weight: 800;
    }


    .input {
      width: 100%;

      height: 54px;

      padding:
        0 15px;

      border:
        1px solid
        rgba(255,255,255,.1);

      border-radius: 14px;

      outline: none;

      background: #080a0e;

      color: #ffffff;

      font-size: 14px;
    }


    .input:focus {
      border-color: #6d5dfc;

      box-shadow:
        0 0 0 4px
        rgba(109,93,252,.1);
    }


    .email-input {
      color: #aeb3bd;
    }


    .password-wrapper {
      position: relative;
    }


    .password-wrapper .input {
      padding-right: 55px;
    }


    .eye-btn {
      position: absolute;

      right: 5px;

      top: 50%;

      transform:
        translateY(-50%);

      width: 44px;
      height: 44px;

      border: none;

      background: transparent;

      color: #888e99;

      font-size: 17px;

      cursor: pointer;

      z-index: 10;
    }


    /* =========================
       LOGIN BUTTON
       ========================= */

    .login-btn {
      width: 100%;

      min-height: 55px;

      margin-top: 5px;

      border: none;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #6d5dfc,
          #8b7fff
        );

      color: #ffffff;

      font-size: 14px;

      font-weight: 900;

      cursor: pointer;

      touch-action: manipulation;

      transition:
        transform .2s ease,
        opacity .2s ease;
    }


    .login-btn:hover {
      transform:
        translateY(-2px);
    }


    .login-btn:active {
      transform:
        translateY(0)
        scale(.99);
    }


    .login-btn:disabled {
      opacity: .6;

      cursor: wait;

      transform: none;
    }



    /* =========================
       MESSAGE
       ========================= */

    .message {
      display: none;

      margin-top: 15px;

      padding: 12px 14px;

      border-radius: 12px;

      font-size: 12px;

      line-height: 1.6;
    }


    .message.show {
      display: block;
    }


    .message.error {
      color: #ffb4be;

      background:
        rgba(255,80,100,.08);

      border:
        1px solid
        rgba(255,80,100,.18);
    }


    .message.success {
      color: #a7f0c7;

      background:
        rgba(50,210,130,.08);

      border:
        1px solid
        rgba(50,210,130,.18);
    }


    .security {
      margin-top: 22px;

      color: #5e6570;

      text-align: center;

      font-size: 11px;

      line-height: 1.7;
    }



    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 850px) {

      .login-wrapper {
        grid-template-columns: 1fr;

        max-width: 520px;
      }


      .left {
        min-height: 390px;

        padding: 28px;
      }


      .right {
        min-height: auto;

        padding: 32px 24px 38px;
      }


      .pills {
        display: none;
      }


      .logo {
        width: 90px;
        height: 90px;
      }


      .left h1 {
        font-size: 43px;
      }

    }


    @media (max-width: 480px) {

      body {
        padding: 10px;
      }


      .login-wrapper {
        border-radius: 20px;
      }


      .left {
        min-height: 340px;

        padding: 22px;
      }


      .right {
        padding:
          26px 18px 30px;
      }


      .left h1 {
        font-size: 36px;
      }


      .heading h2 {
        font-size: 28px;
      }

    }

  </style>

</head>


<body>


  <div class="login-wrapper">


    <!-- =========================
         LEFT
         ========================= -->

    <section class="left">


      <a
        href="../"
        class="back"
      >
        ← Back Home
      </a>


      <div>


        <img
          src="https://github.com/yourdocuments/masha.github.io/blob/main/logo.png?raw=true"
          class="logo"
          alt="SNK Business"
        >


        <div class="eyebrow">
          PERSONAL COURSE STUDIO
        </div>


        <h1>
          Welcome<br>
          <span>Back.</span>
        </h1>


        <p class="description">
          আপনার Mentor Studio অথবা Admin
          Panel-এ নিরাপদভাবে প্রবেশ করুন।
        </p>


      </div>


      <div class="pills">

        <span class="pill">
          🔐 Secure
        </span>

        <span class="pill">
          ☁ Firebase
        </span>

        <span class="pill">
          🎬 Studio
        </span>

      </div>


    </section>



    <!-- =========================
         RIGHT
         ========================= -->

    <section class="right">


      <div class="form-box">


        <div class="heading">

          <h2>
            Sign in
          </h2>

          <p>
            প্রথমে account type নির্বাচন করুন,
            তারপর password দিন।
          </p>

        </div>



        <!-- ROLE -->

        <div class="roles">


          <button
            type="button"
            class="role-btn active"
            id="mentorBtn"
          >
            🎓 Mentor
          </button>


          <button
            type="button"
            class="role-btn"
            id="adminBtn"
          >
            👑 Admin
          </button>


        </div>



        <!-- FORM -->

        <form
          id="loginForm"
        >


          <div class="field">

            <label>
              Account
            </label>


            <input
              type="text"
              id="email"
              class="input email-input"
              value="mentor@snkitinstitute.com"
              readonly
            >

          </div>



          <div class="field">

            <label>
              Firebase Password
            </label>


            <div class="password-wrapper">


              <input
                type="password"
                id="password"
                class="input"
                placeholder="Password লিখুন"
                autocomplete="current-password"
              >


              <button
                type="button"
                id="eyeBtn"
                class="eye-btn"
              >
                👁
              </button>


            </div>

          </div>



          <button
            type="submit"
            id="loginBtn"
            class="login-btn"
          >
            Continue as Mentor
          </button>


          <div
            id="message"
            class="message"
          ></div>


        </form>


        <div class="security">
          Firebase Authentication ব্যবহার করে
          আপনার login নিরাপদ রাখা হচ্ছে।
        </div>


      </div>


    </section>


  </div>



  <!-- =====================================================
       IMPORTANT:
       এই script-এ Firebase নেই।
       তাই Mentor/Admin button অবশ্যই কাজ করবে।
       ===================================================== -->

  <script>


    /* =========================
       ACCOUNT DATA
       ========================= */

    const MENTOR_EMAIL =
      "mentor@snkitinstitute.com";


    const ADMIN_EMAIL =
      "admin@snkitinstitute.com";



    /* =========================
       ELEMENTS
       ========================= */

    const mentorBtn =
      document.getElementById(
        "mentorBtn"
      );


    const adminBtn =
      document.getElementById(
        "adminBtn"
      );


    const emailInput =
      document.getElementById(
        "email"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const loginBtn =
      document.getElementById(
        "loginBtn"
      );


    const eyeBtn =
      document.getElementById(
        "eyeBtn"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const message =
      document.getElementById(
        "message"
      );



    /* =========================
       CURRENT ROLE
       ========================= */

    let currentRole =
      "mentor";



    /* =========================
       MESSAGE
       ========================= */

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        "message show " +
        type;

    }


    function clearMessage() {

      message.textContent =
        "";

      message.className =
        "message";

    }



    /* =========================
       SELECT MENTOR
       ========================= */

    function selectMentor() {

      currentRole =
        "mentor";


      mentorBtn.classList.add(
        "active"
      );


      adminBtn.classList.remove(
        "active"
      );


      emailInput.value =
        MENTOR_EMAIL;


      loginBtn.textContent =
        "Continue as Mentor";


      passwordInput.value =
        "";


      clearMessage();


      console.log(
        "Selected role: Mentor"
      );

    }



    /* =========================
       SELECT ADMIN
       ========================= */

    function selectAdmin() {

      currentRole =
        "admin";


      adminBtn.classList.add(
        "active"
      );


      mentorBtn.classList.remove(
        "active"
      );


      emailInput.value =
        ADMIN_EMAIL;


      loginBtn.textContent =
        "Continue as Admin";


      passwordInput.value =
        "";


      clearMessage();


      console.log(
        "Selected role: Admin"
      );

    }



    /* =========================
       BUTTON EVENTS
       ========================= */

    mentorBtn.addEventListener(
      "click",
      function () {

        selectMentor();

      }
    );


    adminBtn.addEventListener(
      "click",
      function () {

        selectAdmin();

      }
    );



    /* =========================
       PASSWORD EYE
       ========================= */

    eyeBtn.addEventListener(
      "click",
      function () {

        if (
          passwordInput.type ===
          "password"
        ) {

          passwordInput.type =
            "text";

          eyeBtn.textContent =
            "🙈";

        } else {

          passwordInput.type =
            "password";

          eyeBtn.textContent =
            "👁";

        }

      }
    );



    /* =========================
       INITIAL
       ========================= */

    selectMentor();


    console.log(
      "LOGIN UI READY"
    );


  </script>



  <!-- =====================================================
       FIREBASE AUTH
       ===================================================== -->

  <script type="module">


    import {
      auth
    } from "../firebase.js";


    import {
      signInWithEmailAndPassword,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";



    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        const password =
          passwordInput.value.trim();


        if (!password) {

          showMessage(
            "Password লিখুন।",
            "error"
          );

          passwordInput.focus();

          return;

        }


        loginBtn.disabled =
          true;


        loginBtn.textContent =
          "Signing in...";


        try {


          /*
           * আগের Firebase session থাকলে
           * প্রথমে logout করি।
           */

          if (
            auth.currentUser
          ) {

            await signOut(
              auth
            );

          }


          const email =
            currentRole === "admin"
              ? ADMIN_EMAIL
              : MENTOR_EMAIL;


          const result =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            result.user;


          const userEmail =
            String(
              user.email || ""
            )
              .toLowerCase()
              .trim();


          /*
           * Security check
           */

          if (
            userEmail !==
            email
          ) {

            await signOut(
              auth
            );

            throw new Error(
              "Account mismatch"
            );

          }



          /* =========================
             SESSION
             ========================= */

          sessionStorage.setItem(
            "personalCourseStudioRole",
            currentRole
          );


          sessionStorage.setItem(
            "personalCourseStudioUsername",
            currentRole
          );


          sessionStorage.setItem(
            "personalCourseStudioUid",
            user.uid
          );


          if (
            currentRole ===
            "admin"
          ) {

            sessionStorage.setItem(
              "personalCourseStudioAdminLoggedIn",
              "true"
            );


            sessionStorage.removeItem(
              "personalCourseStudioMentorLoggedIn"
            );

          }


          if (
            currentRole ===
            "mentor"
          ) {

            sessionStorage.setItem(
              "personalCourseStudioMentorLoggedIn",
              "true"
            );


            sessionStorage.removeItem(
              "personalCourseStudioAdminLoggedIn"
            );

          }



          showMessage(
            "Login successful. Opening panel...",
            "success"
          );



          /* =========================
             REDIRECT
             ========================= */

          setTimeout(
            function () {

              if (
                currentRole ===
                "admin"
              ) {

                window.location.href =
                  "../admin/";

              } else {

                window.location.href =
                  "../mentor/";

              }

            },
            700
          );


        } catch (error) {


          console.error(
            "Firebase Login Error:",
            error
          );


          let errorMessage =
            "Login করা যায়নি।";


          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            errorMessage =
              "Email অথবা password সঠিক নয়।";

          }


          else if (
            error.code ===
            "auth/wrong-password"
          ) {

            errorMessage =
              "Password সঠিক নয়।";

          }


          else if (
            error.code ===
            "auth/user-not-found"
          ) {

            errorMessage =
              "এই Firebase account পাওয়া যায়নি।";

          }


          else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            errorMessage =
              "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";

          }


          else if (
            error.code ===
            "auth/network-request-failed"
          ) {

            errorMessage =
              "Internet connection সমস্যা হয়েছে।";

          }


          showMessage(
            errorMessage,
            "error"
          );


          loginBtn.disabled =
            false;


          loginBtn.textContent =
            currentRole === "admin"
              ? "Continue as Admin"
              : "Continue as Mentor";

        }

      }
    );


  </script>


</body>
</html>
