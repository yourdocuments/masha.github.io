<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Sign In | Masha Live
  </title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    :root {

      --bg: #050609;

      --panel: #101219;

      --panel-soft: #151821;

      --border: rgba(255,255,255,.09);

      --text: #f5f7fb;

      --muted: #9298a5;

      --accent: #6d5dfc;

      --accent-light: #8b7fff;

      --success: #42d995;

      --danger: #ff667b;

    }


    html,
    body {

      width: 100%;
      min-height: 100%;

    }


    body {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      color: var(--text);

      background:

        radial-gradient(
          circle at 10% 10%,
          rgba(109,93,252,.20),
          transparent 32%
        ),

        radial-gradient(
          circle at 90% 90%,
          rgba(0,180,220,.09),
          transparent 30%
        ),

        var(--bg);

    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {

      width: 100%;

      max-width: 1050px;

    }


    .login-card {

      width: 100%;

      min-height: 650px;

      display: grid;

      grid-template-columns: 1fr 1fr;

      overflow: hidden;

      border:
        1px solid
        var(--border);

      border-radius: 28px;

      background:
        rgba(12,14,20,.96);

      box-shadow:
        0 35px 100px
        rgba(0,0,0,.55);

    }


    /* =====================================================
       LEFT
       ===================================================== */

    .left {

      position: relative;

      padding: 45px;

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(109,93,252,.17),
          rgba(10,11,16,.25)
        );

    }


    .left::after {

      content: "";

      position: absolute;

      width: 350px;

      height: 350px;

      right: -180px;

      bottom: -180px;

      border-radius: 50%;

      background:
        rgba(109,93,252,.18);

      filter: blur(80px);

      pointer-events: none;

    }


    .back {

      position: relative;

      z-index: 5;

      display: inline-flex;

      width: fit-content;

      padding:
        10px 15px;

      color: #d5d8e0;

      text-decoration: none;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 12px;

      background:
        rgba(255,255,255,.035);

      font-size: 13px;

      font-weight: 700;

    }


    .brand {

      position: relative;

      z-index: 5;

    }


    .logo {

      width: 115px;

      height: 115px;

      object-fit: contain;

      padding: 8px;

      margin-bottom: 26px;

      border-radius: 22px;

      border:
        1px solid
        rgba(255,255,255,.08);

      background:
        rgba(255,255,255,.035);

    }


    .eyebrow {

      margin-bottom: 14px;

      color: #9c91ff;

      font-size: 11px;

      font-weight: 800;

      letter-spacing: 2px;

      text-transform: uppercase;

    }


    .left h1 {

      margin-bottom: 20px;

      font-size:
        clamp(
          42px,
          5vw,
          68px
        );

      line-height: .95;

      letter-spacing: -3px;

    }


    .left h1 span {

      color: #9c91ff;

    }


    .description {

      max-width: 440px;

      color: var(--muted);

      font-size: 15px;

      line-height: 1.8;

    }


    .pills {

      position: relative;

      z-index: 5;

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

    }


    .pill {

      padding:
        9px 13px;

      border:
        1px solid
        rgba(255,255,255,.07);

      border-radius: 999px;

      background:
        rgba(255,255,255,.035);

      color: #a7acb6;

      font-size: 11px;

      font-weight: 700;

    }


    /* =====================================================
       RIGHT
       ===================================================== */

    .right {

      padding: 45px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .form-box {

      width: 100%;

      max-width: 390px;

    }


    .heading {

      margin-bottom: 25px;

    }


    .heading h2 {

      margin-bottom: 8px;

      font-size: 32px;

      letter-spacing: -1px;

    }


    .heading p {

      color: var(--muted);

      font-size: 13px;

      line-height: 1.7;

    }


    /* =====================================================
       ROLE SWITCHER
       ===================================================== */

    .roles {

      width: 100%;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      padding: 5px;

      margin-bottom: 24px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 15px;

      background: #080a0e;

    }


    .role-btn {

      width: 100%;

      min-height: 52px;

      border: 0;

      outline: 0;

      border-radius: 11px;

      background: transparent;

      color: #777e89;

      font-family: inherit;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;

      transition:
        background .2s ease,
        color .2s ease,
        transform .1s ease;

      -webkit-tap-highlight-color:
        transparent;

      touch-action: manipulation;

    }


    .role-btn:hover {

      color: #ffffff;

    }


    .role-btn:active {

      transform:
        scale(.97);

    }


    .role-btn.active {

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #27233e,
          #191c25
        );

      box-shadow:
        0 6px 20px
        rgba(0,0,0,.25);

    }


    /* =====================================================
       FIELD
       ===================================================== */

    .field {

      margin-bottom: 17px;

    }


    .field label {

      display: block;

      margin-bottom: 8px;

      color: #c7cbd3;

      font-size: 12px;

      font-weight: 800;

    }


    .input {

      width: 100%;

      height: 54px;

      padding:
        0 15px;

      border:
        1px solid
        rgba(255,255,255,.09);

      border-radius: 14px;

      outline: none;

      background: #080a0e;

      color: #ffffff;

      font-family: inherit;

      font-size: 14px;

    }


    .input::placeholder {

      color: #656b76;

    }


    .input:focus {

      border-color:
        rgba(109,93,252,.8);

      box-shadow:
        0 0 0 4px
        rgba(109,93,252,.08);

    }


    /* =====================================================
       PASSWORD
       ===================================================== */

    .password-box {

      position: relative;

    }


    .password-box .input {

      padding-right: 55px;

    }


    .eye {

      position: absolute;

      right: 5px;

      top: 50%;

      transform:
        translateY(-50%);

      width: 44px;

      height: 44px;

      border: 0;

      background: transparent;

      color: #7f8692;

      font-size: 17px;

      cursor: pointer;

    }


    /* =====================================================
       SUBMIT
       ===================================================== */

    .submit {

      width: 100%;

      min-height: 55px;

      margin-top: 5px;

      border: 0;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-light)
        );

      color: #ffffff;

      font-family: inherit;

      font-size: 14px;

      font-weight: 900;

      cursor: pointer;

      transition:
        transform .2s ease,
        opacity .2s ease;

    }


    .submit:hover {

      transform:
        translateY(-2px);

    }


    .submit:active {

      transform:
        translateY(0);

    }


    .submit:disabled {

      opacity: .65;

      cursor: wait;

      transform: none;

    }


    /* =====================================================
       MESSAGE
       ===================================================== */

    .message {

      display: none;

      margin-top: 15px;

      padding:
        12px 14px;

      border-radius: 12px;

      font-size: 12px;

      line-height: 1.6;

    }


    .message.show {

      display: block;

    }


    .message.error {

      color: #ffb3be;

      border:
        1px solid
        rgba(255,100,120,.18);

      background:
        rgba(255,100,120,.07);

    }


    .message.success {

      color: #a4efc4;

      border:
        1px solid
        rgba(57,217,138,.18);

      background:
        rgba(57,217,138,.07);

    }


    /* =====================================================
       SECURITY
       ===================================================== */

    .security {

      margin-top: 22px;

      color: #606773;

      text-align: center;

      font-size: 11px;

      line-height: 1.7;

    }


    /* =====================================================
       SPINNER
       ===================================================== */

    .spinner {

      display: inline-block;

      width: 15px;

      height: 15px;

      margin-right: 7px;

      border:
        2px solid
        rgba(255,255,255,.3);

      border-top-color:
        #ffffff;

      border-radius: 50%;

      vertical-align: -3px;

      animation:
        spin .7s linear infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (
      max-width: 850px
    ) {

      body {

        padding: 12px;

      }


      .login-card {

        grid-template-columns: 1fr;

        max-width: 520px;

        min-height: auto;

        border-radius: 22px;

      }


      .left {

        min-height: 390px;

        padding: 28px;

      }


      .right {

        padding:
          32px 24px 38px;

      }


      .pills {

        display: none;

      }


      .logo {

        width: 90px;

        height: 90px;

      }


      .left h1 {

        font-size: 43px;

      }

    }


    @media (
      max-width: 480px
    ) {

      .left {

        min-height: 340px;

        padding: 22px;

      }


      .right {

        padding:
          26px 18px 30px;

      }


      .left h1 {

        font-size: 36px;

      }


      .heading h2 {

        font-size: 28px;

      }

    }

  </style>

</head>


<body>


  <div class="page">


    <main class="login-card">


      <!-- =================================================
           LEFT
           ================================================= -->

      <section class="left">


        <a
          href="../"
          class="back"
        >
          ← Back Home
        </a>


        <div class="brand">


          <img
            class="logo"
            src="https://github.com/yourdocuments/masha.github.io/blob/main/logo.png?raw=true"
            alt="Masha Live"
          >


          <div class="eyebrow">
            Personal Course Studio
          </div>


          <h1>

            Welcome<br>

            <span>
              Back.
            </span>

          </h1>


          <p class="description">

            আপনার Mentor Studio অথবা
            Admin Panel-এ নিরাপদভাবে
            প্রবেশ করুন।

          </p>


        </div>


        <div class="pills">

          <span class="pill">
            🔐 Secure Login
          </span>

          <span class="pill">
            ☁ Firebase
          </span>

          <span class="pill">
            🎬 Studio
          </span>

        </div>


      </section>



      <!-- =================================================
           RIGHT
           ================================================= -->

      <section class="right">


        <div class="form-box">


          <div class="heading">

            <h2>
              Sign in
            </h2>

            <p>

              আপনার account type নির্বাচন
              করে email ও password দিয়ে
              login করুন।

            </p>

          </div>



          <!-- =================================================
               ROLE BUTTONS
               ================================================= -->

          <div class="roles">


            <button
              type="button"
              id="mentorBtn"
              class="role-btn active"
            >

              🎓 Mentor

            </button>


            <button
              type="button"
              id="adminBtn"
              class="role-btn"
            >

              👑 Admin

            </button>


          </div>



          <!-- =================================================
               LOGIN FORM
               ================================================= -->

          <form
            id="loginForm"
            autocomplete="on"
          >


            <!-- EMAIL -->

            <div class="field">


              <label
                for="email"
              >
                Email
              </label>


              <input
                id="email"
                class="input"
                type="email"
                placeholder="আপনার Firebase email লিখুন"
                autocomplete="username"
                required
              >


            </div>



            <!-- PASSWORD -->

            <div class="field">


              <label
                for="password"
              >
                Firebase Password
              </label>


              <div class="password-box">


                <input
                  id="password"
                  class="input"
                  type="password"
                  placeholder="আপনার password লিখুন"
                  autocomplete="current-password"
                  required
                >


                <button
                  type="button"
                  id="eyeBtn"
                  class="eye"
                  aria-label="Show password"
                >

                  👁

                </button>


              </div>


            </div>



            <!-- SUBMIT -->

            <button
              type="submit"
              id="submitBtn"
              class="submit"
            >

              Continue as Mentor

            </button>


            <!-- MESSAGE -->

            <div
              id="message"
              class="message"
              role="alert"
            ></div>


          </form>


          <div class="security">

            Firebase Authentication দ্বারা
            আপনার login পরিচালনা করা হচ্ছে।

          </div>


        </div>


      </section>


    </main>


  </div>



  <!-- =====================================================
       LOGIN UI
       ===================================================== -->

  <script>

    "use strict";


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const mentorBtn =
      document.getElementById(
        "mentorBtn"
      );


    const adminBtn =
      document.getElementById(
        "adminBtn"
      );


    const emailInput =
      document.getElementById(
        "email"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const submitBtn =
      document.getElementById(
        "submitBtn"
      );


    const eyeBtn =
      document.getElementById(
        "eyeBtn"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const message =
      document.getElementById(
        "message"
      );


    /* =====================================================
       STATE
       ===================================================== */

    let selectedRole =
      "mentor";


    /* =====================================================
       MESSAGE
       ===================================================== */

    function clearMessage() {

      message.textContent =
        "";

      message.className =
        "message";

    }


    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        "message show " +
        type;

    }


    /* =====================================================
       ROLE UI
       
       IMPORTANT:
       এখানে EMAIL পরিবর্তন করা হবে না।
       ===================================================== */

    function selectRole(
      role
    ) {

      selectedRole =
        role;


      mentorBtn.classList.toggle(
        "active",
        role === "mentor"
      );


      adminBtn.classList.toggle(
        "active",
        role === "admin"
      );


      submitBtn.textContent =
        role === "mentor"
          ? "Continue as Mentor"
          : "Continue as Admin";


      clearMessage();


      console.log(
        "Selected role:",
        selectedRole
      );


      console.log(
        "Current email:",
        emailInput.value
      );

    }


    /* =====================================================
       MENTOR
       ===================================================== */

    mentorBtn.addEventListener(
      "click",
      function () {

        selectRole(
          "mentor"
        );

      }
    );


    /* =====================================================
       ADMIN
       ===================================================== */

    adminBtn.addEventListener(
      "click",
      function () {

        selectRole(
          "admin"
        );

      }
    );


    /* =====================================================
       PASSWORD VISIBILITY
       ===================================================== */

    eyeBtn.addEventListener(
      "click",
      function () {

        if (
          passwordInput.type ===
          "password"
        ) {

          passwordInput.type =
            "text";

          eyeBtn.textContent =
            "🙈";

          eyeBtn.setAttribute(
            "aria-label",
            "Hide password"
          );

        } else {

          passwordInput.type =
            "password";

          eyeBtn.textContent =
            "👁";

          eyeBtn.setAttribute(
            "aria-label",
            "Show password"
          );

        }

      }
    );


    /* =====================================================
       INITIAL ROLE
       ===================================================== */

    selectRole(
      "mentor"
    );


    console.log(
      "Masha Login UI ready."
    );

  </script>



  <!-- =====================================================
       FIREBASE AUTHENTICATION
       ===================================================== -->

  <script type="module">


    import {
      auth
    } from "../firebase.js";


    import {
      signInWithEmailAndPassword,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    /* =====================================================
       CLEAR OLD SESSION
       ===================================================== */

    function clearStudioSession() {

      sessionStorage.removeItem(
        "personalCourseStudioRole"
      );


      sessionStorage.removeItem(
        "personalCourseStudioUsername"
      );


      sessionStorage.removeItem(
        "personalCourseStudioUid"
      );


      sessionStorage.removeItem(
        "personalCourseStudioAdminLoggedIn"
      );


      sessionStorage.removeItem(
        "personalCourseStudioMentorLoggedIn"
      );

    }


    /* =====================================================
       FIREBASE ERROR
       ===================================================== */

    function getFirebaseError(
      error
    ) {

      console.error(
        "Masha Firebase Login Error:",
        error
      );


      const code =
        error?.code || "";


      switch (
        code
      ) {


        case "auth/invalid-credential":

          return
            "Email অথবা password সঠিক নয়।";


        case "auth/wrong-password":

          return
            "Password সঠিক নয়।";


        case "auth/user-not-found":

          return
            "এই Firebase account পাওয়া যায়নি।";


        case "auth/too-many-requests":

          return
            "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";


        case "auth/network-request-failed":

          return
            "Internet connection সমস্যা হয়েছে।";


        case "auth/user-disabled":

          return
            "এই account disabled করা আছে।";


        case "auth/invalid-email":

          return
            "Firebase email সঠিক নয়।";


        case "auth/operation-not-allowed":

          return
            "Firebase Email/Password Authentication চালু নেই।";


        default:

          return
            "Login করা যায়নি। আবার চেষ্টা করুন।";

      }

    }


    /* =====================================================
       LOGIN
       ===================================================== */

    loginForm.addEventListener(
      "submit",
      async function (
        event
      ) {


        event.preventDefault();


        /* =================================================
           USER ENTERED EMAIL
           ================================================= */

        const email =
          emailInput.value
            .trim()
            .toLowerCase();


        /* =================================================
           USER ENTERED PASSWORD
           ================================================= */

        const password =
          passwordInput.value.trim();


        /* =================================================
           EMAIL CHECK
           ================================================= */

        if (!email) {

          showMessage(
            "Email লিখুন।",
            "error"
          );


          emailInput.focus();


          return;

        }


        /* =================================================
           PASSWORD CHECK
           ================================================= */

        if (!password) {

          showMessage(
            "Password লিখুন।",
            "error"
          );


          passwordInput.focus();


          return;

        }


        /* =================================================
           LOADING
           ================================================= */

        submitBtn.disabled =
          true;


        submitBtn.innerHTML =
          '<span class="spinner"></span>Signing in...';


        clearMessage();


        try {


          /* ===============================================
             CLEAR OLD SESSION
             =============================================== */

          clearStudioSession();


          /* ===============================================
             SIGN OUT OLD FIREBASE USER
             =============================================== */

          if (
            auth.currentUser
          ) {

            await signOut(
              auth
            );

          }


          /* ===============================================
             FIREBASE LOGIN
             =============================================== */

          const result =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            result.user;


          /* ===============================================
             REAL FIREBASE EMAIL
             =============================================== */

          const actualEmail =
            String(
              user.email || ""
            )
              .trim()
              .toLowerCase();


          /* ===============================================
             SESSION
             =============================================== */

          sessionStorage.setItem(
            "personalCourseStudioRole",
            selectedRole
          );


          sessionStorage.setItem(
            "personalCourseStudioUsername",
            email
          );


          sessionStorage.setItem(
            "personalCourseStudioUid",
            user.uid
          );


          /* ===============================================
             MENTOR
             =============================================== */

          if (
            selectedRole ===
            "mentor"
          ) {


            sessionStorage.setItem(
              "personalCourseStudioMentorLoggedIn",
              "true"
            );


            sessionStorage.removeItem(
              "personalCourseStudioAdminLoggedIn"
            );

          }


          /* ===============================================
             ADMIN
             =============================================== */

          if (
            selectedRole ===
            "admin"
          ) {


            sessionStorage.setItem(
              "personalCourseStudioAdminLoggedIn",
              "true"
            );


            sessionStorage.removeItem(
              "personalCourseStudioMentorLoggedIn"
            );

          }


          /* ===============================================
             SUCCESS
             =============================================== */

          showMessage(
            "Login successful. Opening " +
            (
              selectedRole ===
              "mentor"
                ? "Mentor"
                : "Admin"
            ) +
            "...",
            "success"
          );


          /* ===============================================
             REDIRECT
             =============================================== */

          setTimeout(
            function () {


              if (
                selectedRole ===
                "mentor"
              ) {


                window.location.replace(
                  "../mentor/"
                );


                return;

              }


              if (
                selectedRole ===
                "admin"
              ) {


                window.location.replace(
                  "../admin/"
                );


              }

            },
            700
          );


        } catch (
          error
        ) {


          /* ===============================================
             ERROR
             =============================================== */

          showMessage(
            getFirebaseError(
              error
            ),
            "error"
          );


          submitBtn.disabled =
            false;


          submitBtn.textContent =
            selectedRole ===
            "mentor"
              ? "Continue as Mentor"
              : "Continue as Admin";

        }

      }
    );


    console.log(
      "Masha Firebase Login ready."
    );


  </script>


</body>

</html>
