<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentor Studio | Personal Course Studio</title>
<meta name="description" content="Private Mentor Studio for Personal Course Studio.">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#070b14">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070b14;color:#f8fafc;overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(37,99,235,.13),transparent 28%),radial-gradient(circle at 85% 80%,rgba(124,58,237,.10),transparent 30%),#070b14}

/* TOP BAR */
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(7,11,20,.92);backdrop-filter:blur(18px);position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-logo{width:42px;height:42px;border-radius:11px;object-fit:contain;background:#fff;padding:4px}
.brand-text{min-width:0}
.brand-title{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-subtitle{margin-top:2px;font-size:11px;color:rgba(255,255,255,.42);white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:8px}
.mode-badge{padding:8px 11px;border-radius:999px;background:rgba(37,99,235,.12);border:1px solid rgba(96,165,250,.18);color:#93c5fd;font-size:10px;font-weight:900;letter-spacing:.10em}
.top-btn{min-height:38px;padding:0 13px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);color:rgba(255,255,255,.78);font-size:12px;font-weight:800;transition:.2s ease}
.top-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.top-btn.logout{color:#fca5a5;border-color:rgba(248,113,113,.14)}
.top-btn:disabled{opacity:.55;cursor:wait}

/* MAIN */
.main{width:min(1500px,100%);margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.studio{min-width:0;display:flex;flex-direction:column;gap:14px}
.studio-header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px;border:1px solid rgba(255,255,255,.07);border-radius:18px;background:rgba(255,255,255,.035)}
.studio-header h1{font-size:20px;letter-spacing:-.03em}
.studio-header p{margin-top:4px;font-size:12px;color:rgba(255,255,255,.45)}
.sync-status{display:inline-flex;align-items:center;gap:7px;padding:8px 10px;border-radius:999px;font-size:10px;font-weight:900;white-space:nowrap}
.sync-status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sync-status.live{color:#86efac;background:rgba(34,197,94,.08)}
.sync-status.local{color:#fcd34d;background:rgba(245,158,11,.08)}
.sync-status.error{color:#fca5a5;background:rgba(239,68,68,.08)}

/* STAGE */
.stage{position:relative;width:100%;min-height:540px;aspect-ratio:16/9;max-height:calc(100vh - 250px);border-radius:20px;overflow:hidden;isolation:isolate;border:1px solid rgba(255,255,255,.09);background:#020617;box-shadow:0 30px 80px rgba(0,0,0,.34)}
.stage.empty{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(37,99,235,.09),transparent 42%),#020617}
.stage-placeholder{text-align:center;max-width:430px;padding:30px}
.stage-icon{width:66px;height:66px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:rgba(37,99,235,.12);border:1px solid rgba(96,165,250,.16);font-size:28px}
.stage-placeholder h2{font-size:20px}
.stage-placeholder p{margin-top:9px;font-size:13px;line-height:1.7;color:rgba(255,255,255,.45)}
#mainImage,#mainVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#020617;display:none}
.stage-label{position:absolute;top:16px;left:16px;z-index:12;max-width:calc(100% - 32px);padding:9px 12px;border-radius:10px;background:rgba(2,6,23,.78);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(12px);cursor:move;user-select:none}
.stage-label strong{display:block;font-size:12px}
.stage-label span{display:block;margin-top:2px;font-size:9px;color:rgba(255,255,255,.44)}
.brand-badge{position:absolute;right:16px;top:16px;z-index:12;max-width:220px;padding:8px 11px;border-radius:10px;background:rgba(2,6,23,.72);border:1px solid rgba(255,255,255,.08);color:#bfdbfe;font-size:10px;font-weight:800;backdrop-filter:blur(12px);cursor:move;user-select:none}
.stage.recording-clean .stage-label,.stage.recording-clean .brand-badge,.stage.recording-clean .camera-label{visibility:hidden}

/* MENTOR CAMERA */
.mentor-camera{position:absolute;right:18px;bottom:18px;width:220px;aspect-ratio:16/10;z-index:20;overflow:hidden;border-radius:16px;border:1px solid rgba(255,255,255,.15);background:#020617;box-shadow:0 20px 50px rgba(0,0,0,.45);cursor:move;display:none;touch-action:none;transition:background .25s ease}
.mentor-camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:transparent;pointer-events:none}
.camera-label{position:absolute;left:9px;bottom:9px;z-index:2;padding:6px 8px;border-radius:8px;background:rgba(2,6,23,.75);font-size:9px;font-weight:800}
.camera-frame{position:absolute;inset:0;z-index:0;display:none;background-size:cover;background-position:center;pointer-events:none}
.mentor-camera.has-frame .camera-frame{display:block}
.mentor-camera video{position:relative;z-index:1}
.mentor-camera.has-frame video{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);border-radius:10px}
